<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dejar reseña | ReseñaTuApto</title>

    <link rel="manifest" href="../manifest.json">

    <meta name="theme-color" content="#ff6b35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ReseñaTuApto">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

    <header class="header">

        <nav class="navbar">

            <a href="../index.html" class="navbar__logo">
                ReseñaTuApto
            </a>

            <button class="navbar__toggle" id="navbarToggle" aria-label="Abrir menú">
                ☰
            </button>

            <div class="navbar__content" id="navbarContent">

                <ul class="navbar__menu">

                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="./buscar.html">Buscar</a></li>
                    <li><a href="./resenar.html">Reseñar</a></li>
                    <li><a href="./sobre.html">Sobre</a></li>

                </ul>

                <a href="./resenar.html" class="navbar__button">
                    Dejar reseña
                </a>

            </div>

        </nav>

    </header>

    <main class="review-form-page">

        <div class="section-heading">

            <span class="section-heading__tag">
                Compartí tu experiencia
            </span>

            <h1 class="section-heading__title">
                Ayudá a futuros inquilinos
            </h1>

            <p class="section-heading__text">
                Contá cómo fue vivir en el apartamento y ayudá a otros a tomar mejores decisiones.
            </p>

        </div>

        <form class="review-form">

            <div class="form-group">

                <label for="barrio">
                    Barrio *
                </label>

                <select id="barrio" required>

                    <option value="">Seleccionar barrio</option>
                    <option>Aguada</option>
                    <option>Buceo</option>
                    <option>Carrasco</option>
                    <option>Centro</option>
                    <option>Ciudad Vieja</option>
                    <option>Cordón</option>
                    <option>Goes</option>
                    <option>La Blanqueada</option>
                    <option>Malvín</option>
                    <option>Maroñas</option>
                    <option>Nuevo Centro</option>
                    <option>Palermo</option>
                    <option>Parque Batlle</option>
                    <option>Punta Gorda</option>
                    <option>Tres Cruces</option>
                    <option>Unión</option>

                </select>

            </div>

            <div class="form-group">

                <label for="direccion">
                    Calle o referencia
                </label>

                <input
                    type="text"
                    id="direccion"
                    placeholder="Ej: Rivera y Soca"
                >

            </div>

            <div class="form-group">

                <label for="titulo">
                    Título *
                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ej: Buen apartamento pero muy húmedo"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Calificación *
                </label>

                <div class="stars" id="stars">

                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>

                </div>

                <input
                    type="hidden"
                    id="calificacion"
                    value="0"
                >

            </div>

            <div class="form-group">

                <label for="humedad">
                    Humedad
                </label>

                <select id="humedad">

                    <option value="">Seleccionar</option>
                    <option>Ninguna</option>
                    <option>Poca</option>
                    <option>Moderada</option>
                    <option>Mucha</option>

                </select>

            </div>

            <div class="form-group">

                <label for="ruido">
                    Ruido
                </label>

                <select id="ruido">

                    <option value="">Seleccionar</option>
                    <option>Bajo</option>
                    <option>Medio</option>
                    <option>Alto</option>

                </select>

            </div>

            <div class="form-group">

                <label for="seguridad">
                    Seguridad
                </label>

                <select id="seguridad">

                    <option value="">Seleccionar</option>
                    <option>Buena</option>
                    <option>Regular</option>
                    <option>Mala</option>

                </select>

            </div>

            <div class="form-group">

                <label for="trato">
                    Trato del dueño/inmobiliaria
                </label>

                <select id="trato">

                    <option value="">Seleccionar</option>
                    <option>Excelente</option>
                    <option>Bueno</option>
                    <option>Regular</option>
                    <option>Malo</option>

                </select>

            </div>

            <div class="form-group">

                <label for="imagen">
                    Link de imagen
                </label>

                <input
                    type="text"
                    id="imagen"
                    placeholder="https://..."
                >

            </div>

            <div class="form-group">

                <label for="imagenArchivo">
                    O subir imagen
                </label>

                <input
                    type="file"
                    id="imagenArchivo"
                    accept="image/*"
                >

            </div>

            <div class="image-preview" id="imagePreview">

                <img
                    src=""
                    alt="Preview"
                    id="previewImg"
                >

            </div>

            <div class="form-group">

                <label for="comentario">
                    Reseña *
                </label>

                <textarea
                    id="comentario"
                    rows="6"
                    placeholder="Contá tu experiencia..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="form-submit">
                Publicar reseña
            </button>

        </form>

    </main>

    <nav class="mobile-bottom-nav">

        <a href="../index.html">
            <span>🏠</span>
            Inicio
        </a>

        <a href="./buscar.html">
            <span>🔍</span>
            Buscar
        </a>

        <a href="./resenar.html" class="active">
            <span>⭐</span>
            Reseñar
        </a>

        <a href="./sobre.html">
            <span>💬</span>
            Sobre
        </a>

    </nav>

    <a
        href="https://www.instagram.com/resenatuapto?igsh=bTZ3amIwZWJ4YTht"
        class="instagram-float"
        target="_blank"
    >
        <img
            src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
            alt="Instagram"
        >
    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script type="module" src="../js/main.js"></script>

</body>
</html>
